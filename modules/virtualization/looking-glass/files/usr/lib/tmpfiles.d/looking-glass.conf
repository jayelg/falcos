# The client and QEMU share this file, and whoever creates it decides who
# can use it. Left to QEMU it appears as qemu:qemu 0644, which locks out
# the client: it maps the file read-write and runs as the desktop user,
# not as qemu. Created here instead, owned by qemu so QEMU keeps its
# access, group kvm so a member of that group has it too.
#
# /dev/shm is a tmpfs, so this is remade every boot and no ownership
# fixup survives past one. Empty is correct: QEMU sizes it from the
# domain's shmem device when it opens it.
f /dev/shm/looking-glass 0660 qemu kvm -
