# Template, not a config: scripts/render-iso-config.sh writes the file
# bootc-image-builder actually reads to build/iso.generated.toml, and both
# callers (the Justfile and .github/workflows/build-disk.yml) go through
# it. The image reference below therefore follows the repo it is built
# from, so a fork's ISO installs the fork's own image instead of this one.
#
# IMAGE_REF below is the only placeholder the renderer substitutes, and
# the only braced one this file may contain anywhere, comments included:
# the renderer allowlists that one name and then fails if any brace
# placeholder survives, so a silent no-op cannot ship. A %post that needs
# a shell variable must therefore write $HOME, unbraced.
[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ${IMAGE_REF}
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
