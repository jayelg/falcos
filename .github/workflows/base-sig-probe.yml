---
name: Base image signature probe
on:
  schedule:
    # 6:30 UTC daily: after fedora-bootc composes, before our build.
    # Checks whether quay.io/fedora/fedora-bootc has started publishing
    # cosign signatures so we can gate the FROM pull.
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Resolve base image
        id: base
        run: |
          # Read from the Containerfile template so this probe never
          # drifts from what the build actually pulls.
          base="$(grep -oP '^FROM \Kquay\.io/fedora/fedora-bootc:\S+' Containerfile.template | head -1)"
          echo "image=${base}" >> "$GITHUB_OUTPUT"

      # fedora-bootc is not cosign signed today. When it starts being
      # signed, this step sets signed=true and we open a tracking issue to
      # gate the FROM pull with policy.json.
      #
      # Not `cosign verify`: it requires either --key or a certificate
      # identity, and fedora publishes neither for this image, so it exits
      # on flag validation without ever looking at the registry. That
      # cannot distinguish "unsigned" from "wrong flags", and it is a
      # question about existence, not trust: nothing is verified against
      # this answer, an issue is opened for a human to read. So the probe
      # asks where a signature would live and whether anything is there.
      #
      # No continue-on-error. A probe that cannot run is a broken probe,
      # and the point of it is to fire on a day nobody is watching.
      #
      # This finds a signature published the way `cosign sign` publishes
      # one by default, as a `.sig` tag beside the image. A registry-
      # referrers-only signature would not be found; that is the trade for
      # not depending on the referrers API, and it is worth revisiting if
      # fedora signs and this stays quiet.
      - name: Probe for a cosign signature
        id: probe
        run: |
          image="${{ steps.base.outputs.image }}"
          sig="$(cosign triangulate "$image")"
          echo "a signature for ${image} would be published at ${sig}"
          if cosign download signature "$image" > /dev/null 2>&1; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "one is there: fedora-bootc has started signing"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "nothing there, which is the expected answer today"
          fi

      - name: Check for existing tracking issue
        id: existing
        if: steps.probe.outputs.signed == 'true'
        uses: actions/github-script@98814c53be79b1d30f795b907e553d8679345975 # v6.4.0
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['base-image-signing'],
            });
            if (issues.length > 0) {
              core.setOutput('number', issues[0].number);
              core.info(`Existing issue: #${issues[0].number}`);
            }

      - name: Open tracking issue
        if: steps.probe.outputs.signed == 'true' && !steps.existing.outputs.number
        uses: actions/github-script@98814c53be79b1d30f795b907e553d8679345975 # v6.4.0
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'fedora-bootc base image is now cosign signed',
              labels: ['base-image-signing'],
              body: [
                'A cosign signature is published for `${{ steps.base.outputs.image }}`.',
                '',
                '## What to do',
                '',
                '1. Gate the `FROM` pull in the Containerfile with a `policy.json`',
                '   and `registries.d` entry on the builder (CI).',
                '2. Bake the fedora-bootc public key into the image so `bootc` can',
                '   verify the base layer signature at upgrade time.',
                '3. Close this issue once both are in place.',
                '',
                'Until the gate is in place, the build continues to pull the base',
                'image without signature verification — the same as today.',
              ].join('\n'),
            });
            core.info(`Created issue: #${issue.number}`);
