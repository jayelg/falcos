---
# Keeps the `signed` field on every image's `base` matching what its
# registry actually publishes, and opens a PR when it does not.
#
# Nothing reads `signed` at build time. Gating the FROM pull on a
# signature needs a policy.json and a registries.d entry on the builder,
# and the field turning #true is the signal that doing that work is now
# possible. Until then this is a watch, not a gate: a PR from here never
# changes what a build produces.
#
# Every declared image is probed, not just the default one, because each
# image names its own base and a repository building on two of them has
# two answers to keep current.
#
# Not `cosign verify`: it needs a key or a certificate identity, and a
# registry that publishes no signature publishes no key either, so it
# would exit on flag validation without reaching the registry. That
# cannot tell "unsigned" from "wrong flags". The question here is whether
# a signature exists, so the probe asks where one would live and whether
# anything is there.
#
# This finds a signature published the way `cosign sign` publishes one by
# default, as a `.sig` tag beside the image. A referrers-only signature
# would be missed; that is the trade for not depending on the referrers
# API, and it is worth revisiting the day a base signs and this stays
# quiet.
name: Base image signature probe

on:
  schedule:
    - cron: '30 6 * * *'  # after fedora-bootc composes, before our build
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      # `manifest base-signatures` reports every image with its base and
      # the value currently recorded, which is the same parse the build
      # uses, so the probe cannot drift from what the FROM actually pulls.
      #
      # The edit is a sed over the one image file that declared the value,
      # matched on the whole `signed #<old>` line, the same way checksums.yml
      # rewrites a sha256. A file declares one base, so there is nothing
      # for it to misread.
      - name: Probe each base and correct the declaration
        id: probe
        run: |
          set -euo pipefail
          changed=""
          while IFS='|' read -r image base recorded; do
            [ -n "${image}" ] || continue
            if cosign download signature "${base}" > /dev/null 2>&1; then
              actual="true"
            else
              actual="false"
            fi
            echo "${image}: ${base} is $([ "${actual}" = true ] && echo signed || echo unsigned), recorded as ${recorded}"
            [ "${actual}" != "${recorded}" ] || continue

            file="$(./scripts/manifest.sh image-file "${image}")"
            sed -i "s/signed #${recorded}/signed #${actual}/" "${file}"
            echo "  corrected ${file}: signed #${recorded} -> #${actual}"
            changed="${changed}${changed:+, }\`${image}\` (\`${base}\`): \`#${recorded}\` to \`#${actual}\`"
          done < <(./scripts/manifest.sh base-signatures)

          if [ -z "${changed}" ]; then
            echo "every base matches its declaration"
            exit 0
          fi
          {
            echo "changed=true"
            echo "summary=${changed}"
          } >> "${GITHUB_OUTPUT}"

      # A PR rather than a push to main: this is a security-relevant fact
      # about the build's input, so it gets a human. The branch is fixed,
      # so a base that flaps updates the open PR instead of opening a
      # second one.
      #
      # GITHUB_TOKEN pushes do not trigger workflows, so nothing is
      # dispatched here on purpose: `signed` reaches no generated file and
      # no build arg, so there is nothing about this change to validate.
      - name: Open or update the correction PR
        if: steps.probe.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
        run: |
          set -euo pipefail
          branch="base-signature-status"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add ./*.kdl
          git commit -m "Record the base image signature status" \
            -m "${SUMMARY}"
          git push --force-with-lease origin "${branch}"

          if gh pr view "${branch}" --json number > /dev/null 2>&1; then
            echo "updated the open PR for ${branch}"
            exit 0
          fi

          # A quoted heredoc, so the backticks and #-prefixed values in the
          # body below stay text. The summary is the one substitution, and
          # it is prepended rather than interpolated.
          body="$(mktemp)"
          printf '%s\n\n' "${SUMMARY}" > "${body}"
          cat >> "${body}" <<'EOF'
          The `signed` field on a base records whether that image publishes a
          cosign signature. It is maintained by
          [this workflow](.github/workflows/base-sig-probe.yml) rather than by
          hand, so this PR only makes the declaration match the registry.

          **Nothing about the build changes.** `signed` reaches no generated
          file, no build arg and no layer, and the images this repository
          publishes are cosign signed either way.

          ## If a base turned `#true`

          The FROM pull can now be gated, which is the point of tracking this:

          1. Add a `policy.json` and a `registries.d` entry on the builder so
             the pull is verified rather than trusted.
          2. Bake the base's public key into the image so `bootc` can verify
             the base layer at upgrade time.

          ## If a base turned `#false`

          A base that was publishing signatures has stopped. Worth finding out
          why before merging.
          EOF

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${branch}" \
            --title "Base image signature status changed" \
            --body-file "${body}"
