---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # 12:30 UTC daily: after the fedora-bootc:44 push (~11:30 UTC, with
    # margin for drift), so the cache written here is built on today's base
    # and stays valid for pushes/PRs until tomorrow's base lands.
    - cron: '30 12 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '.github/workflows/cleanup-registry.yml'
  workflow_dispatch:
    inputs:
      kernel:
        description: >-
          Override the Containerfile KERNEL arg (cachyos or stock; empty
          uses the repo default). stock builds validate the fallback
          kernel path and are never pushed, signed, or cached.
        type: string
        default: ''

env:
  # Tiny image used only to prove the OCI runtime can start a container.
  # On quay, so it does not spend a Docker Hub anonymous pull.
  PROBE_IMAGE: "quay.io/podman/hello:latest"
  IMAGE_DESC: "Custom Fedora bootc image"
  IMAGE_KEYWORDS: "bootc,fedora"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/99842644?v=4"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

jobs:
  # Lint gates the build: compute-matrix needs all three, so a failure here
  # stops the matrix before any image is built. They live in this workflow
  # rather than their own so the gate is a job dependency on the same commit.
  shellcheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # shellcheck over every Bash script in the repo, then a generator dry
      # run that validates image.kdl without a full image build. The
      # script owns the file set, so `just lint` checks exactly what this
      # gate checks. shellcheck is preinstalled on the runner image.
      - name: Run lint
        run: ./scripts/lint.sh

  actionlint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  # Unit tests for kernel-freshness scripts discovered in module dirs
  script-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Discover and run kernel-freshness tests
        run: |
          mapfile -t dirs < <(find modules -name test_kernel_freshness.py -type f -exec dirname {} \; | sort -u)
          for d in "${dirs[@]}"; do
            echo "==> Running tests in ${d}..."
            python3 -m unittest discover -s "$d" -v
          done

  # Builds every target declared in image.kdl: for each image, the ungated
  # set published unsuffixed, then one per flavor. A separate job because
  # the matrix context isn't available in a job-level if.
  #
  # Renovate automerges are already validated by their PR build and are
  # skipped here; the daily scheduled build picks them up together with
  # upstream drift (see .github/renovate.json5).
  compute-matrix:
    needs: [shellcheck, actionlint, script-tests]
    if: github.event_name != 'push' || github.actor != 'renovate[bot]'
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.set.outputs.targets }}
      base_provides: ${{ steps.set.outputs.base_provides }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: set
        run: |
          # Pull requests build one target, for half the runner time.
          # Which one is declared in image.kdl as pr-build rather than
          # inferred from list position, because covering the most build
          # surface and being the default are unrelated properties that
          # only happen to coincide.
          selection="targets"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            selection="pr"
          fi
          targets="$(./scripts/targets.sh "$selection" \
            | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

          # What the base image itself brings, declared in image.kdl.
          # Resolved once here rather than per matrix leg, since it is a
          # property of the base and not of the target being built.
          provides="$(./scripts/manifest.sh base-provides \
            | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "base_provides=${provides}" >> "$GITHUB_OUTPUT"

  build_push:
    needs: compute-matrix
    name: Build and push image (${{ matrix.target }})
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        target: ${{ fromJson(needs.compute-matrix.outputs.targets) }}
      fail-fast: false

    concurrency:
      # event_name included so a push doesn't cancel the daily schedule run
      # (same ref) — that run exists specifically to refresh the cache.
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.run_id }}-${{ matrix.target }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      # Checked out first because the steps below read scripts/targets.sh.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Separate image per target so tag history is independent and
      # bootc switch targets are unambiguous. The ungated build publishes
      # as falcos, device variants as falcos-<flavor>.
      - name: Prepare environment
        env:
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "IMAGE_NAME=$(./scripts/targets.sh image "$TARGET")"
            # The expanded build for this image: one generated Containerfile
            # per image, so every flavor of it reads the same file. The
            # image is the half of the target before the slash. Resolved
            # once here for the source label and the artifact upload below.
            echo "CONTAINERFILE=containerfiles/${TARGET%%/*}.generated"
          } >> "${GITHUB_ENV}"
          # Publish gate for the export/rechunk/push/sign steps below
          if [ "${{ github.event_name }}" != "pull_request" ] \
             && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
             && [ "${{ github.event.inputs.kernel }}" != "stock" ]; then
            echo "PUBLISH=true" >> "${GITHUB_ENV}"
          else
            echo "PUBLISH=false" >> "${GITHUB_ENV}"
          fi

      # Both the rechunk below and the disk build run a privileged
      # container with `sudo podman run`, and crun on the hosted runners
      # began failing every such call with "unknown version specified"
      # around 2026-07-29T09:00Z. It is the runtime, not anything here:
      # the same error appeared on upstream's bootc-image-builder image,
      # on an unchanged runner image label, hours after the identical
      # command last worked.
      #
      # Probed rather than pinned, so this reverts itself once crun is
      # fixed and nobody has to remember to remove it. Run early because
      # the alternative is discovering it after a full image build.
      #
      # Outputs a --runtime flag for the rechunk step instead of modifying
      # the global container runtime config, so the probe does not alter
      # system files.
      - name: Select a working container runtime
        id: runtime
        run: |
          echo "podman: $(podman --version)"
          for rt in crun runc; do
            if command -v "$rt" > /dev/null; then
              echo "${rt}: $("$rt" --version | head -1)"
            else
              echo "${rt}: absent"
            fi
          done
          if sudo podman run --rm --runtime crun "$PROBE_IMAGE" > /dev/null 2>&1; then
            echo "crun works; leaving the default alone"
            echo "flag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::crun cannot start a container on this runner; falling back to runc"
          if ! command -v runc > /dev/null; then
            echo "::error::crun cannot start a container and runc is not installed, so there is no working OCI runtime on this runner"
            exit 1
          fi
          # Fails the job here rather than 40 minutes in if runc is no
          # better, which is the whole point of probing this early.
          sudo podman run --rm --runtime runc "$PROBE_IMAGE" > /dev/null
          echo "flag=--runtime=runc" >> "$GITHUB_OUTPUT"
          echo "runc can start a container"

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          # Single value for the version tag, OCI label and IMAGE_VERSION
          # build-arg so they can't disagree across a midnight boundary
          echo "version=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Record which base each image was built on. The FROM tracks the :44
      # tag on purpose — quay.io prunes old fedora-bootc digests within days,
      # so a git digest pin 404s before Renovate can bump it (renovate.json5
      # documents this), and pinning would freeze out the daily Fedora
      # updates the rebuild exists to pull. Fedora doesn't cosign-sign the
      # base yet, so the pull can't be gated either. Until it can, resolve
      # the tag and stamp the digest onto the image as the OCI base
      # annotations: no gate, but every published falcos image then carries
      # an auditable record of exactly which fedora-bootc digest produced it.
      # Base ref comes from the manifest, which is also what the generated
      # FROM is emitted from, so the two can't drift. Resolved seconds
      # before the build; quay only moves the tag on a new compose, so the
      # window doesn't realistically race.
      - name: Resolve base image digest
        id: base
        run: |
          set -euo pipefail
          base="$(./scripts/manifest.sh base-image)"
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://${base}")"
          echo "name=${base}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.date.outputs.version }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }} (${{ matrix.target }})
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/blob/${{ github.sha }}/${{ env.CONTAINERFILE }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.date.outputs.version }}
            org.opencontainers.image.base.name=${{ steps.base.outputs.name }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1

      # Build secrets, derived from the manifests but never chosen by them.
      # Which IDs a target wants comes from the module manifests; which
      # ones this repository is willing to satisfy is the SECRET_ env list
      # below, one line per secret. Adding a secret to a module is a
      # manifest line plus a line here.
      #
      # Both halves matter. `toJSON(secrets)` would remove the second line
      # but hand every repository secret, the cosign signing key included,
      # to a loop driven by manifest content. The SECRET_ prefix is the
      # same argument one level down: without it a manifest declaring
      # `secret "path"` would read $PATH out of this step's environment
      # and write it out as a build secret.
      #
      # Gated on PUBLISH, so a build that never ships an image never has a
      # private key on disk. A declared ID this list does not cover is a
      # warning and no file: every secret is `required=false` in the
      # Containerfile, so a fork builds cleanly without them, and an empty
      # file would look like a key while signing nothing.
      #
      # The directory is the interface to the build step below: one file
      # per secret, named by its ID.
      - name: Write the declared build secrets
        if: env.PUBLISH == 'true'
        env:
          TARGET: ${{ matrix.target }}
          SECRET_MOK_PRIVKEY: ${{ secrets.MOK_PRIVKEY }}
        run: |
          umask 077
          mkdir -p "${RUNNER_TEMP}/build-secrets"
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            # The ID becomes a variable name and a filename, so hold it to
            # what both accept rather than trusting the manifest with
            # either. An out-of-tree manifest is data from elsewhere.
            case "$id" in
              *[!a-z0-9_]*)
                echo "::warning::build secret id '${id}' is not [a-z0-9_], ignoring it"
                continue
                ;;
            esac
            name="SECRET_${id^^}"
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::warning::a module declares the build secret '${id}'," \
                "but this workflow passes no ${name}. Building without it."
              continue
            fi
            printf '%s' "$value" > "${RUNNER_TEMP}/build-secrets/${id}"
            echo "wrote build secret ${id} from ${name}"
          done < <(./scripts/manifest.sh secrets "$TARGET")

      # The runner's BuildKit builder. BuildKit content-addresses each RUN
      # --mount by the mounted path, which the Containerfile's narrow
      # per-group mounts rely on for caching. Local builds run their own
      # buildkitd in a podman container, so both resolve the same cache
      # keys and can share the registry cache written below.
      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Runner-user login, used by the buildx cache-to registry writes
      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # scripts/build.sh owns the Containerfile generation, the build args,
      # the cache refs and how a secret reaches BuildKit; `just build` runs the same
      # script, so a local build of this commit and this one cannot differ
      # in anything but the backend that reaches BuildKit. What stays here
      # is CI policy: which events may read and write the registry cache,
      # and which produce a publishable artifact.
      #
      # Registry layer cache, gated by event so caching doesn't mask
      # upstream drift in unpinned packages:
      #   schedule: write-only, exists to catch drift and refresh the cache
      #   push/workflow_dispatch on main: read and write
      #   pull_request: read-only, anonymous (public package)
      #
      # Publishing builds export an OCI archive rather than pushing; the
      # chunked repack below is what gets published.
      - name: Build image
        env:
          TARGET: ${{ matrix.target }}
          KERNEL_INPUT: ${{ github.event.inputs.kernel }}
          EVENT: ${{ github.event_name }}
          ON_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          IMAGE_VERSION: ${{ steps.date.outputs.version }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          LABELS: ${{ steps.metadata.outputs.labels }}
        run: |
          args=(--backend buildx --target "$TARGET")
          # Whatever the step above wrote, by the ID it named the file
          # with. Absent on a build that does not publish, and absent per
          # secret the repository does not hold.
          for secret in "${RUNNER_TEMP}"/build-secrets/*; do
            [ -f "$secret" ] || continue
            args+=(--secret "$(basename "$secret")=${secret}")
          done
          if [ -n "$KERNEL_INPUT" ]; then
            args+=(--kernel "$KERNEL_INPUT")
          fi
          if [ "$EVENT" = "schedule" ]; then
            args+=(--no-cache-from)
          fi
          # stock-kernel validation builds must not clobber the cache the
          # daily cachyos builds rely on
          if [ "$KERNEL_INPUT" != "stock" ] \
             && { [ "$EVENT" = "schedule" ] \
                  || { [ "$EVENT" != "pull_request" ] && [ "$ON_DEFAULT_BRANCH" = "true" ]; }; }; then
            args+=(--cache-to)
          fi
          if [ "$PUBLISH" = "true" ]; then
            args+=(--oci-output "${RUNNER_TEMP}/raw-oci.tar")
          fi
          ./scripts/build.sh "${args[@]}"

      # What this job actually built, from the same parser the generator
      # reads: the modules this target carries, in layer order, with the
      # options each was given. Descriptions come from the manifests, so a
      # published image gets a readable record of its contents without
      # anyone opening forty RUN lines.
      - name: Summarize the resolved build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "## ${IMAGE_NAME}"
            echo
            ./scripts/manifest.sh summary "$TARGET"
          } >> "$GITHUB_STEP_SUMMARY"

      # The expanded build, kept with the run rather than only with the
      # commit, so a run stays readable after the branch it ran on moves.
      - name: Upload the generated Containerfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: containerfile-${{ env.IMAGE_NAME }}
          path: ${{ env.CONTAINERFILE }}
          retention-days: 30

      - name: Setup Syft
        id: setup-syft
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # build-chunked-oci reads from root containers-storage. :latest
      # selects one image — the buildx export indexes one entry per tag.
      # Imported before the SBOM step so syft can scan the mounted rootfs
      # instead of the compressed archive (see below).
      - name: Import image into containers-storage
        if: env.PUBLISH == 'true'
        run: |
          sudo skopeo copy "oci-archive:${RUNNER_TEMP}/raw-oci.tar:latest" \
            "containers-storage:localhost/${IMAGE_NAME}:raw"
          rm -f "${RUNNER_TEMP}/raw-oci.tar"

      - name: Generate SBOM
        if: env.PUBLISH == 'true'
        env:
          SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        run: |
          # Scanning an "oci-archive:" source made syft/stereoscope
          # decompress and assemble the whole multi-GB bootc image tree in
          # memory *before* any cataloger ran — that image assembly, not the
          # catalogers, is what OOM-killed the 16GB runner (it thrashed for
          # ~16 min, then the host lost its heartbeat and the job was
          # cancelled). Cataloger/parallelism/swap tuning never touched that
          # sink because it happens during source loading.
          #
          # Mount the already-imported image and point syft at the rootfs
          # directory: a "dir:" source streams files from the overlay on
          # disk instead of holding an assembled image. Peak memory drops
          # from OOM to a few hundred MB. Run as root — the merged mount and
          # mode-0000 files (e.g. /etc/shadow) are root-only; chown the
          # output back so the later attest step can read it.
          #
          # The 'rpm' cataloger tag (resolves to just rpm-db-cataloger in
          # the default dir set) is scope, not an OOM mitigation: RPMs are
          # the supply-chain inventory this SBOM exists to attest, and
          # reading only the RPM DB keeps package discovery to the DB
          # rather than fingerprinting a multi-GB rootfs.
          # --select-catalogers takes tags here, not cataloger names (a
          # bare name errors out).
          #
          # This document is the file-level one: cataloger selection does
          # not stop syft capturing the files those packages own, so it
          # carries an entry per owned path (220k of them, 148MB) on top of
          # the ~2.2k packages. That is why it is uploaded as an artifact
          # and reduced before being attested, in the steps below.
          mnt="$(sudo podman image mount "localhost/${IMAGE_NAME}:raw")"
          sudo "$SYFT_CMD" scan "dir:${mnt}" \
            --source-name "${IMAGE_NAME}" \
            --select-catalogers 'rpm' \
            -o "spdx-json=${RUNNER_TEMP}/sbom.spdx.json"
          sudo podman image umount "localhost/${IMAGE_NAME}:raw"
          sudo chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/sbom.spdx.json"
          du -sh "${RUNNER_TEMP}/sbom.spdx.json"

      # cosign base64-encodes the predicate into the attestation layer and
      # refuses a layer over 128MiB, so the file-level SBOM (148MB, 197MB
      # encoded) has never been verifiable: `cosign verify-attestation`
      # fails on it for us and for anyone consuming these images. Raising
      # COSIGN_MAX_ATTACHMENT_SIZE is not a fix, it is an environment
      # variable every consumer would have to set too.
      #
      # So attest the package inventory, which is what the SBOM is for and
      # is a few MB, and keep the file-level document as the artifact
      # uploaded below. syft can drop the file data at source
      # (relationships.package-file-ownership=false) but that would mean a
      # second full scan to still produce the artifact.
      #
      # All three deletions are needed: leaving hasFiles or a relationship
      # pointing at a dropped file entry makes the document dangle, which
      # SPDX validators reject. One pass over the large document, then the
      # checks read the small one.
      - name: Reduce the SBOM and add the pinned payloads
        if: env.PUBLISH == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          jq -c '
            del(.files)
            | .packages |= map(del(.hasFiles))
            | .relationships |= map(select(
                ((.spdxElementId      | startswith("SPDXRef-File-")) or
                 (.relatedSpdxElement | startswith("SPDXRef-File-"))) | not))
          ' "${RUNNER_TEMP}/sbom.spdx.json" > "${RUNNER_TEMP}/sbom.packages.spdx.json"

          # syft catalogues the RPM database, so the payloads the modules
          # fetch and unpack themselves — a Wine build, tarballs of DLLs, a
          # .NET installer, prebuilt binaries — appear nowhere in it. They
          # are pinned with a URL and a SHA256 in their module's manifest,
          # which is everything an SBOM entry needs, so they are generated
          # from the same blocks the build fetches from. Per target, because
          # a gated module's payloads only land in that flavor's image.
          #
          # Merged before the checks below, so the added entries are held to
          # the same shape as syft's. Not into the file-level document: that
          # one exists to answer "which package owns this path", which an
          # entry with filesAnalyzed false cannot.
          ./scripts/sbom-assets.sh "$TARGET" > "${RUNNER_TEMP}/assets.spdx.json"
          jq -c --slurpfile add "${RUNNER_TEMP}/assets.spdx.json" '
            .packages += $add[0].packages
            | .relationships += $add[0].relationships
          ' "${RUNNER_TEMP}/sbom.packages.spdx.json" > "${RUNNER_TEMP}/merged.spdx.json"
          mv "${RUNNER_TEMP}/merged.spdx.json" "${RUNNER_TEMP}/sbom.packages.spdx.json"

          # A syft output change that renamed file SPDXIDs would silently
          # stop the filter matching, so assert the result resolves. The
          # added payloads relate to SPDXRef-DOCUMENT, which this covers too.
          if ! jq -e '
            (([.SPDXID] + [.packages[].SPDXID]) | map({key:., value:true}) | from_entries) as $ids
            | [.relationships[] | select(($ids[.spdxElementId] // false | not)
                                      or ($ids[.relatedSpdxElement] // false | not))] | length == 0
          ' "${RUNNER_TEMP}/sbom.packages.spdx.json" > /dev/null; then
            echo "::error::filtered SBOM references SPDX ids it does not define"
            exit 1
          fi

          # Fail here rather than in cosign at the end of the build
          bytes="$(wc -c < "${RUNNER_TEMP}/sbom.packages.spdx.json")"
          if [ "$bytes" -gt 94371840 ]; then
            echo "::error::package SBOM is ${bytes} bytes; over ~90MB it exceeds cosign's attachment limit once encoded"
            exit 1
          fi
          echo "packages: $(jq '.packages | length' "${RUNNER_TEMP}/sbom.packages.spdx.json")" \
            "(including $(jq '.packages | length' "${RUNNER_TEMP}/assets.spdx.json") pinned payloads)," \
            "${bytes} bytes"

      # The file-level document answers "which package owns this path",
      # which is worth keeping even though it cannot be attested. Uploaded
      # before the push so it exists for triage even if a later step fails.
      - name: Upload file-level SBOM
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ env.IMAGE_NAME }}
          path: ${{ runner.temp }}/sbom.spdx.json
          retention-days: 30

      # Repack into content-stable chunks (one layer per package group) so
      # bootc upgrade only downloads what changed. rpm-ostree runs from the
      # image itself so the chunker matches the ostree stack it operates
      # on; rootless is blocked upstream (coreos/rpm-ostree#5346).
      #
      # `rpm-ostree compose build-chunked-oci` is the rpm-ostree way of
      # doing this, so the step asks the manifest whether the base provides
      # `rechunking` rather than assuming every base ships rpm-ostree. A
      # base that does not declare it is published unchunked: a larger
      # first pull, not a failed build.
      - name: Rechunk image
        id: rechunk
        if: env.PUBLISH == 'true' && contains(fromJSON(needs.compute-matrix.outputs.base_provides), 'rechunking')
        run: |
          sudo podman run --rm --privileged ${{ steps.runtime.outputs.flag }} \
            --volume /var/lib/containers:/var/lib/containers \
            "localhost/${IMAGE_NAME}:raw" \
            rpm-ostree compose build-chunked-oci \
            --bootc --max-layers 127 --format-version=2 \
            --from "localhost/${IMAGE_NAME}:raw" \
            --output "containers-storage:localhost/${IMAGE_NAME}:chunked"
          # Peak disk: :raw and :chunked both exist here, on top of the
          # BuildKit cache. Measured to judge whether the Maximize build
          # space step is still earning its ~2 min (see the df after push).
          echo "==> Disk at peak (raw + chunked both present)"
          df -h /
          sudo podman rmi "localhost/${IMAGE_NAME}:raw"
          # What the push step copies from. Set here rather than assumed,
          # because :chunked only exists if this step ran.
          echo "tag=chunked" >> "$GITHUB_OUTPUT"

      # The docker login above only covers the runner user; the sudo
      # skopeo push needs root credentials.
      - name: Login to GitHub Container Registry (root)
        if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Tags after the first are registry-side copies of its digest, so
      # every tag shares one manifest for cosign to cover.
      #
      # Five retries rather than three, because everything expensive has
      # already happened by here: a ghcr.io 502 part way through a blob
      # upload throws away a 45 minute build and a rechunk. Deliberately
      # no --retry-delay, which would swap skopeo's exponential backoff
      # for a fixed one, and backoff is what rides out a registry blip.
      - name: Push image
        id: push
        if: env.PUBLISH == 'true'
        env:
          # :chunked when the rechunk step ran, :raw when the base does not
          # declare `rechunking` and it was skipped. The rest of the push
          # is the same either way.
          SOURCE_TAG: ${{ steps.rechunk.outputs.tag || 'raw' }}
        run: |
          digest=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if [ -z "$digest" ]; then
              sudo skopeo copy --retry-times 5 \
                "containers-storage:localhost/${IMAGE_NAME}:${SOURCE_TAG}" \
                "docker://${tag}" --digestfile "${RUNNER_TEMP}/digestfile"
              digest="$(cat "${RUNNER_TEMP}/digestfile")"
            else
              sudo skopeo copy --retry-times 5 \
                "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}" \
                "docker://${tag}"
            fi
          done <<< "${{ steps.metadata.outputs.tags }}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Report disk usage
        if: env.PUBLISH == 'true'
        run: |
          echo "==> Disk after push"
          df -h /

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        if: env.PUBLISH == 'true'
        run: |
          # Sign by digest, covers every tag and avoids racing a moving tag
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_FULL}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      # No Rekor upload: the public tlog rejects multi-MB SBOM envelopes
      # and verification is key-based against the baked-in cosign.pub, so
      # verify with --insecure-ignore-tlog=true.
      - name: Attest SBOM
        if: env.PUBLISH == 'true'
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          # default 3m timeout covers the whole multi-MB blob upload and
          # has been hit on slow ghcr days
          cosign attest --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false --timeout=10m \
            --type spdxjson --predicate "${RUNNER_TEMP}/sbom.packages.spdx.json" \
            "${IMAGE_FULL}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      # Verify what was just published the same way a client does: key-based
      # against the cosign.pub this image bakes in, with no transparency-log
      # check, which is what the baked policy.json actually enforces. Catches
      # a broken sign or attest step in the run that caused it rather than on
      # the next bootc upgrade.
      - name: Verify signature and attestation
        if: env.PUBLISH == 'true'
        run: |
          IMAGE_DIGEST="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          # The key moved into the module that owns the signing policy, so
          # its repo path is asked for rather than written down here, the
          # way the Justfile resolves the Secure Boot cert.
          key="modules/$(./scripts/manifest.sh find-provider /etc/pki/containers/cosign.pub)/files/etc/pki/containers/cosign.pub"
          [ -f "$key" ] || { echo "no module provides the cosign key" >&2; exit 1; }
          # stdout discarded on both: what verification says is on stderr
          # and in the exit code, while stdout is the payload echoed back.
          # For the attestation that payload is the whole decoded SBOM
          # predicate, about 9MB on one line, and feeding that to the
          # Actions log collector wedges the step long after cosign has
          # finished its work.
          cosign verify --key "$key" --insecure-ignore-tlog=true \
            "${IMAGE_DIGEST}" > /dev/null
          cosign verify-attestation --key "$key" --type spdxjson \
            --insecure-ignore-tlog=true "${IMAGE_DIGEST}" > /dev/null

      # Old versions are pruned daily by cleanup-registry.yml, which keeps
      # the newest tagged builds and their cosign signatures/attestations.
