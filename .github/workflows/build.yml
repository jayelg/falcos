---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    # 12:30 UTC daily: after the fedora-bootc:44 push (~11:30 UTC, with
    # margin for drift), so the cache written here is built on today's base
    # and stays valid for pushes/PRs until tomorrow's base lands.
    - cron: '30 12 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - '.github/workflows/cleanup-registry.yml'
  workflow_dispatch:
    inputs:
      kernel:
        description: >-
          Override the Containerfile KERNEL arg (cachyos or stock; empty
          uses the repo default). stock builds validate the fallback
          kernel path and are never pushed, signed, or cached.
        type: string
        default: ''

env:
  IMAGE_DESC: "Custom Fedora bootc image"
  IMAGE_KEYWORDS: "bootc,fedora"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/99842644?v=4"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

jobs:
  # Lint gates the build: compute-matrix needs all three, so a failure here
  # stops the matrix before any image is built. They live in this workflow
  # rather than their own so the gate is a job dependency on the same commit.
  shellcheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # shellcheck over every Bash script in the repo, then a generator dry
      # run that validates components.list without a full image build. The
      # script owns the file set, so `just lint` checks exactly what this
      # gate checks. shellcheck is preinstalled on the runner image.
      - name: Run lint
        run: ./scripts/lint.sh

  actionlint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12

  # Unit tests for kernel-freshness scripts discovered in component dirs
  script-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Discover and run kernel-freshness tests
        run: |
          mapfile -t dirs < <(find components -name test_kernel_freshness.py -type f -exec dirname {} \; | sort -u)
          for d in "${dirs[@]}"; do
            echo "==> Running tests in ${d}..."
            python3 -m unittest discover -s "$d" -v
          done

  # Builds every flavor listed in Containerfile ARG FLAVORS. A separate job
  # because the matrix context isn't available in a job-level if.
  #
  # Renovate automerges are already validated by their PR build and are
  # skipped here; the daily scheduled build picks them up together with
  # upstream drift (see .github/renovate.json5).
  compute-matrix:
    needs: [shellcheck, actionlint, script-tests]
    if: github.event_name != 'push' || github.actor != 'renovate[bot]'
    runs-on: ubuntu-24.04
    outputs:
      flavors: ${{ steps.set.outputs.flavors }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: set
        run: |
          # Pull requests build the default flavor only, for half the runner
          # time. It is the better single choice because its flavor-gated
          # components include a DKMS build, so it covers more build surface
          # than the others.
          selection=list
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            selection=default
          fi
          flavors="$(./scripts/flavors.sh "$selection" \
            | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "flavors=${flavors}" >> "$GITHUB_OUTPUT"

  build_push:
    needs: compute-matrix
    name: Build and push image (${{ matrix.flavor }})
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        flavor: ${{ fromJson(needs.compute-matrix.outputs.flavors) }}
      fail-fast: false

    concurrency:
      # event_name included so a push doesn't cancel the daily schedule run
      # (same ref) — that run exists specifically to refresh the cache.
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref || github.run_id }}-${{ matrix.flavor }}
      cancel-in-progress: true

    permissions:
      contents: read
      packages: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      # Checked out first because the steps below read scripts/flavors.sh.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Separate image per flavor so tag history is independent and
      # bootc switch targets are unambiguous
      - name: Prepare environment
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=$(./scripts/flavors.sh image "$FLAVOR")" >> "${GITHUB_ENV}"
          # Publish gate for the export/rechunk/push/sign steps below
          if [ "${{ github.event_name }}" != "pull_request" ] \
             && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ] \
             && [ "${{ github.event.inputs.kernel }}" != "stock" ]; then
            echo "PUBLISH=true" >> "${GITHUB_ENV}"
          else
            echo "PUBLISH=false" >> "${GITHUB_ENV}"
          fi

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          # Single value for the version tag, OCI label and IMAGE_VERSION
          # build-arg so they can't disagree across a midnight boundary
          echo "version=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Record which base each image was built on. The FROM tracks the :44
      # tag on purpose — quay.io prunes old fedora-bootc digests within days,
      # so a git digest pin 404s before Renovate can bump it (renovate.json5
      # documents this), and pinning would freeze out the daily Fedora
      # updates the rebuild exists to pull. Fedora doesn't cosign-sign the
      # base yet, so the pull can't be gated either. Until it can, resolve
      # the tag and stamp the digest onto the image as the OCI base
      # annotations: no gate, but every published falcos image then carries
      # an auditable record of exactly which fedora-bootc digest produced it.
      # Base ref is read from the Containerfile FROM so the two can't drift.
      # Resolved seconds before the build; quay only moves the tag on a new
      # compose, so the window doesn't realistically race.
      - name: Resolve base image digest
        id: base
        run: |
          set -euo pipefail
          base="$(grep -oP '^FROM \Kquay\.io/fedora/fedora-bootc:\S+' Containerfile.base | head -1)"
          digest="$(skopeo inspect --format '{{.Digest}}' "docker://${base}")"
          echo "name=${base}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.date.outputs.version }}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }} (${{ matrix.flavor }})
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/blob/${{ github.sha }}/Containerfile.base
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.date.outputs.version }}
            org.opencontainers.image.base.name=${{ steps.base.outputs.name }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1

      # Optional Secure Boot signing key. Gated on PUBLISH so a build that
      # never ships an image never has the private key on disk.
      - name: Write MOK signing key
        if: env.PUBLISH == 'true'
        run: |
          umask 077
          printf '%s' "$MOK_PRIVATE_KEY" > "${RUNNER_TEMP}/mok_privkey.pem"
        env:
          MOK_PRIVATE_KEY: ${{ secrets.MOK_PRIVATE_KEY }}

      # The runner's BuildKit builder. BuildKit content-addresses each RUN
      # --mount by the mounted path, which the Containerfile's narrow
      # per-group mounts rely on for caching. Local builds run their own
      # buildkitd in a podman container, so both resolve the same cache
      # keys and can share the registry cache written below.
      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Runner-user login, used by the buildx cache-to registry writes
      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # scripts/build.sh owns the Containerfile generation, the build args,
      # the cache refs and the secret wiring; `just build` runs the same
      # script, so a local build of this commit and this one cannot differ
      # in anything but the backend that reaches BuildKit. What stays here
      # is CI policy: which events may read and write the registry cache,
      # and which produce a publishable artifact.
      #
      # Registry layer cache, gated by event so caching doesn't mask
      # upstream drift in unpinned packages:
      #   schedule: write-only, exists to catch drift and refresh the cache
      #   push/workflow_dispatch on main: read and write
      #   pull_request: read-only, anonymous (public package)
      #
      # Publishing builds export an OCI archive rather than pushing; the
      # chunked repack below is what gets published.
      - name: Build image
        env:
          FLAVOR: ${{ matrix.flavor }}
          KERNEL_INPUT: ${{ github.event.inputs.kernel }}
          EVENT: ${{ github.event_name }}
          ON_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          IMAGE_VERSION: ${{ steps.date.outputs.version }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          LABELS: ${{ steps.metadata.outputs.labels }}
          MOK_KEY_PATH: ${{ env.PUBLISH == 'true' && format('{0}/mok_privkey.pem', runner.temp) || '' }}
        run: |
          args=(--backend buildx --flavor "$FLAVOR")
          if [ -n "$KERNEL_INPUT" ]; then
            args+=(--kernel "$KERNEL_INPUT")
          fi
          if [ "$EVENT" = "schedule" ]; then
            args+=(--no-cache-from)
          fi
          # stock-kernel validation builds must not clobber the cache the
          # daily cachyos builds rely on
          if [ "$KERNEL_INPUT" != "stock" ] \
             && { [ "$EVENT" = "schedule" ] \
                  || { [ "$EVENT" != "pull_request" ] && [ "$ON_DEFAULT_BRANCH" = "true" ]; }; }; then
            args+=(--cache-to)
          fi
          if [ "$PUBLISH" = "true" ]; then
            args+=(--oci-output "${RUNNER_TEMP}/raw-oci.tar")
          fi
          ./scripts/build.sh "${args[@]}"

      - name: Setup Syft
        id: setup-syft
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # build-chunked-oci reads from root containers-storage. :latest
      # selects one image — the buildx export indexes one entry per tag.
      # Imported before the SBOM step so syft can scan the mounted rootfs
      # instead of the compressed archive (see below).
      - name: Import image into containers-storage
        if: env.PUBLISH == 'true'
        run: |
          sudo skopeo copy "oci-archive:${RUNNER_TEMP}/raw-oci.tar:latest" \
            "containers-storage:localhost/${IMAGE_NAME}:raw"
          rm -f "${RUNNER_TEMP}/raw-oci.tar"

      - name: Generate SBOM
        if: env.PUBLISH == 'true'
        env:
          SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        run: |
          # Scanning an "oci-archive:" source made syft/stereoscope
          # decompress and assemble the whole multi-GB bootc image tree in
          # memory *before* any cataloger ran — that image assembly, not the
          # catalogers, is what OOM-killed the 16GB runner (it thrashed for
          # ~16 min, then the host lost its heartbeat and the job was
          # cancelled). Cataloger/parallelism/swap tuning never touched that
          # sink because it happens during source loading.
          #
          # Mount the already-imported image and point syft at the rootfs
          # directory: a "dir:" source streams files from the overlay on
          # disk instead of holding an assembled image. Peak memory drops
          # from OOM to a few hundred MB. Run as root — the merged mount and
          # mode-0000 files (e.g. /etc/shadow) are root-only; chown the
          # output back so the later attest step can read it.
          #
          # The 'rpm' cataloger tag (resolves to just rpm-db-cataloger in
          # the default dir set) is scope, not an OOM mitigation: RPMs are
          # the supply-chain inventory this SBOM exists to attest, reading
          # only the RPM DB keeps the scan to seconds instead of walking the
          # multi-GB rootfs, and the SPDX output stays small enough to
          # attest (see Rekor note below). --select-catalogers takes tags
          # here, not cataloger names (a bare name errors out).
          mnt="$(sudo podman image mount "localhost/${IMAGE_NAME}:raw")"
          sudo "$SYFT_CMD" scan "dir:${mnt}" \
            --source-name "${IMAGE_NAME}" \
            --select-catalogers 'rpm' \
            -o "spdx-json=${RUNNER_TEMP}/sbom.spdx.json"
          sudo podman image umount "localhost/${IMAGE_NAME}:raw"
          sudo chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/sbom.spdx.json"
          du -sh "${RUNNER_TEMP}/sbom.spdx.json"

      # Repack into content-stable chunks (one layer per package group) so
      # bootc upgrade only downloads what changed. rpm-ostree runs from the
      # image itself so the chunker matches the ostree stack it operates
      # on; rootless is blocked upstream (coreos/rpm-ostree#5346).
      - name: Rechunk image
        if: env.PUBLISH == 'true'
        run: |
          sudo podman run --rm --privileged \
            --volume /var/lib/containers:/var/lib/containers \
            "localhost/${IMAGE_NAME}:raw" \
            rpm-ostree compose build-chunked-oci \
            --bootc --max-layers 127 --format-version=2 \
            --from "localhost/${IMAGE_NAME}:raw" \
            --output "containers-storage:localhost/${IMAGE_NAME}:chunked"
          # Peak disk: :raw and :chunked both exist here, on top of the
          # BuildKit cache. Measured to judge whether the Maximize build
          # space step is still earning its ~2 min (see the df after push).
          echo "==> Disk at peak (raw + chunked both present)"
          df -h /
          sudo podman rmi "localhost/${IMAGE_NAME}:raw"

      # The docker login above only covers the runner user; the sudo
      # skopeo push needs root credentials.
      - name: Login to GitHub Container Registry (root)
        if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Tags after the first are registry-side copies of its digest, so
      # every tag shares one manifest for cosign to cover.
      - name: Push chunked image
        id: push
        if: env.PUBLISH == 'true'
        run: |
          digest=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if [ -z "$digest" ]; then
              sudo skopeo copy --retry-times 3 \
                "containers-storage:localhost/${IMAGE_NAME}:chunked" \
                "docker://${tag}" --digestfile "${RUNNER_TEMP}/digestfile"
              digest="$(cat "${RUNNER_TEMP}/digestfile")"
            else
              sudo skopeo copy --retry-times 3 \
                "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}" \
                "docker://${tag}"
            fi
          done <<< "${{ steps.metadata.outputs.tags }}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Report disk usage
        if: env.PUBLISH == 'true'
        run: |
          echo "==> Disk after push"
          df -h /

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        if: env.PUBLISH == 'true'
        run: |
          # Sign by digest, covers every tag and avoids racing a moving tag
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_FULL}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      # No Rekor upload: the public tlog rejects multi-MB SBOM envelopes
      # and verification is key-based against the baked-in cosign.pub, so
      # verify with --insecure-ignore-tlog=true.
      - name: Attest SBOM
        if: env.PUBLISH == 'true'
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          # default 3m timeout covers the whole multi-MB blob upload and
          # has been hit on slow ghcr days
          cosign attest --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false --timeout=10m \
            --type spdxjson --predicate "${RUNNER_TEMP}/sbom.spdx.json" \
            "${IMAGE_FULL}@${{ steps.push.outputs.digest }}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}

      # Verify what was just published the same way a client does: key-based
      # against the cosign.pub this image bakes in, with no transparency-log
      # check, which is what the baked policy.json actually enforces. Catches
      # a broken sign or attest step in the run that caused it rather than on
      # the next bootc upgrade.
      - name: Verify signature and attestation
        if: env.PUBLISH == 'true'
        run: |
          IMAGE_DIGEST="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          cosign verify --key cosign.pub --insecure-ignore-tlog=true \
            "${IMAGE_DIGEST}"
          cosign verify-attestation --key cosign.pub --type spdxjson \
            --insecure-ignore-tlog=true "${IMAGE_DIGEST}"

      # Old versions are pruned daily by cleanup-registry.yml, which keeps
      # the newest tagged builds and their cosign signatures/attestations.
