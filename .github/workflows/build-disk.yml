---
name: Build disk images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/iso.template.toml'
      - 'scripts/render-iso-config.sh'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # Tiny image used only to prove the OCI runtime can start a container.
  PROBE_IMAGE: "quay.io/podman/hello:latest"
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    # x86_64 only, image content (kernel, musl CLI binaries, prebuilt RPMs)
    # is all x86_64-specific
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Disk images carry the ungated build, by the same rule the ISO
          # kickstart is rendered from, so the installed system cannot
          # track an image other than the one it was installed from.
          # scripts/registry.sh owns the namespace and the lowercasing
          # ghcr.io requires, scripts/targets.sh owns the image name.
          IMAGE_NAME="$(./scripts/targets.sh image "$(./scripts/targets.sh ungated)")"
          IMAGE_REF="$(./scripts/registry.sh ref "$IMAGE_NAME"):${DEFAULT_TAG}"
          {
            echo "IMAGE_REF=${IMAGE_REF}"
            echo "DISK_TYPE=${DISK_TYPE}"
            echo "USER_UID=${USER_UID}"
            echo "USER_GID=${USER_GID}"
          } >> "${GITHUB_ENV}"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      # bootc-image-builder has no flag for the image an anaconda-iso
      # installs, so the reference is rendered into the config first. The
      # script prints where it wrote it, so the path lives in one place.
      - name: Render the installer config
        if: matrix.disk-type == 'anaconda-iso'
        run: echo "ISO_CONFIG=$(./scripts/render-iso-config.sh)" >> "${GITHUB_ENV}"

      # The action pulls the target image with `sudo podman pull`, so the
      # credentials have to reach root's auth store rather than the runner
      # user's. Without this the pull is anonymous, which only works while
      # every image package happens to be public: GitHub makes a package
      # private on its first publish, so a newly added target fails here
      # with a bare 403 until someone flips it by hand. `packages: read`
      # was already granted and simply never used.
      # Both the rechunk below and the disk build run a privileged
      # container with `sudo podman run`, and crun on the hosted runners
      # began failing every such call with "unknown version specified"
      # around 2026-07-29T09:00Z. It is the runtime, not anything here:
      # the same error appeared on upstream's bootc-image-builder image,
      # on an unchanged runner image label, hours after the identical
      # command last worked.
      #
      # Probed rather than pinned, so this reverts itself once crun is
      # fixed and nobody has to remember to remove it. Run early because
      # the alternative is discovering it after a full image build.
      - name: Select a working container runtime
        run: |
          echo "podman: $(podman --version)"
          for rt in crun runc; do
            if command -v "$rt" > /dev/null; then
              echo "${rt}: $("$rt" --version | head -1)"
            else
              echo "${rt}: absent"
            fi
          done
          if sudo podman run --rm --runtime crun "$PROBE_IMAGE" > /dev/null 2>&1; then
            echo "crun works; leaving the default alone"
            exit 0
          fi
          echo "::warning::crun cannot start a container on this runner; falling back to runc"
          if ! command -v runc > /dev/null; then
            echo "::error::crun cannot start a container and runc is not installed, so there is no working OCI runtime on this runner"
            exit 1
          fi
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '[engine]\nruntime = "runc"\n' \
            | sudo tee /etc/containers/containers.conf.d/99-oci-runtime.conf > /dev/null
          # Fails the job here rather than 40 minutes in if runc is no
          # better, which is the whole point of probing this early.
          sudo podman run --rm "$PROBE_IMAGE" > /dev/null
          echo "runc can start a container"

      - name: Login to GitHub Container Registry (root)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # A disk image is built from a published container image, so the
      # interesting failure is that there is not one yet. The action's own
      # failure for that case is a bare 403 from ghcr, which reads like a
      # permissions bug rather than "this has never been pushed", and on
      # one disk type it surfaced later still as an unrelated OCI runtime
      # error. Checked as root, against the same auth store the action's
      # `sudo podman pull` uses, so this cannot pass while the pull fails.
      - name: Check the target image is published
        run: |
          if sudo skopeo inspect --raw "docker://${IMAGE_REF}" > /dev/null 2>&1; then
            echo "${IMAGE_REF} is pullable"
            exit 0
          fi
          echo "${IMAGE_REF} cannot be pulled. Two things cause this:" >&2
          echo >&2
          echo "  * It has never been published. Image packages are created" >&2
          echo "    by a push to the default branch, so a new target has" >&2
          echo "    nothing to build from until that push happens." >&2
          echo "  * It is published but private. GitHub makes a package" >&2
          echo "    private on first publish, and ghcr answers an" >&2
          echo "    unauthorised request with 403 rather than 404, so this" >&2
          echo "    looks identical to the case above. Flip it to public." >&2
          echo "::error::${IMAGE_REF} is not published or not readable; see the log above"
          exit 1

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@30960621b85c9e76c653082f9ef4cab5a10210d5 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && env.ISO_CONFIG || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REF }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          rootfs: btrfs
          additional-args: --use-librepo=True

      - name: Upload disk images and Checksum to Job Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
