---
name: Clean up registry

on:
  schedule:
    - cron: '30 14 * * *'  # ~2h after the 12:30 UTC image build so its pushes are settled
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Log deletions without performing them"
        type: boolean
        default: false

env:
  KEEP: "3"  # tagged builds retained per image

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    # Custom script instead of actions/delete-package-versions: that action
    # cannot tie a cosign sha256-<digest>.sig tag back to the image it signs,
    # so it previously deleted signatures of tags that were still live
    # (actions/delete-package-versions#120). Here signatures are kept or
    # dropped by matching their digest against the kept images.
    steps:
      # Only for scripts/targets.sh, which names the packages to prune
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prune old package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry-run || 'false' }}
        run: |
          set -euo pipefail
          api="users/${OWNER}/packages/container"

          # Every package this prunes is derived from the target list, so
          # one can legitimately not exist yet: a flavor added today has
          # no package until its first publish, and a fresh fork has
          # neither. Under set -e that 404 would abort the whole prune, so
          # a listing failure skips one package instead. Logged as a
          # warning rather than swallowed, so a genuine API failure does
          # not read as an absent package (gh prints the cause above it).
          list_versions() { # pkg -> versions json on stdout
            if ! gh api "${api}/${1}/versions?per_page=100" --paginate; then
              echo "::warning::skipping ${1}: could not list its versions" >&2
              return 1
            fi
          }

          delete_version() { # pkg id note
            if [ "${DRY_RUN}" = "true" ]; then
              echo "dry run: would delete ${1} version ${2} (${3})"
            else
              gh api --method DELETE "${api}/${1}/versions/${2}" >/dev/null
              echo "deleted ${1} version ${2} (${3})"
            fi
          }

          # Image packages, one per target and named the same way build.yml
          # names them: keep the newest KEEP tagged builds plus whatever
          # holds `latest`, the cosign signature and SBOM attestation
          # belonging to each kept digest, and nothing else.
          mapfile -t packages < <(./scripts/targets.sh images)
          for pkg in "${packages[@]}"; do
            echo "== ${pkg}"
            versions="$(list_versions "${pkg}")" || continue
            deletions="$(printf '%s' "${versions}" | jq -s 'add' | jq -r --argjson keep "${KEEP}" '
              def is_sig: test("^sha256-[0-9a-f]{64}\\.(sig|att)$");
              map({id, name, created_at, tags: .metadata.container.tags})
              | map(. + {kind: (if (.tags | length) == 0 then "untagged"
                                elif (.tags | all(is_sig)) then "sig"
                                else "image" end)})
              | (map(select(.kind == "image")) | sort_by(.created_at) | reverse) as $images
              | (($images[:$keep] + ($images | map(select(.tags | index("latest"))))) | unique_by(.id)) as $keepimg
              | ($keepimg | map(.id)) as $keepids
              | ($keepimg | map((.name | sub(":"; "-")) as $n | $n + ".sig", $n + ".att")) as $keepsigs
              | map(select(
                  (.kind == "untagged")
                  or (.kind == "image" and ((.id as $i | $keepids | index($i)) == null))
                  or (.kind == "sig" and ((.tags | map(select(. as $t | $keepsigs | index($t) != null)) | length) == 0))
                ))
              | .[] | [.id, .kind, (.tags | join(","))] | @tsv')"
            [ -n "${deletions}" ] || { echo "nothing to delete"; continue; }
            while IFS=$'\t' read -r id kind tags; do
              delete_version "${pkg}" "${id}" "${kind}${tags:+, tags: ${tags}}"
            done <<<"${deletions}"
          done

          # Cache package: BuildKit overwrites one tag per target, so only
          # manifests tagged with a live one are live; anything else
          # (untagged leftovers, tags of a removed flavor or image,
          # content-keyed hex tags from the buildah era) is dead. The tags
          # are published image names, which is how scripts/build.sh writes
          # a cache ref: a tag cannot hold the slash a target is spelled
          # with.
          pkg="$(./scripts/targets.sh cache-image)"
          live="$(./scripts/targets.sh images | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "== ${pkg}"
          if versions="$(list_versions "${pkg}")"; then
            deletions="$(printf '%s' "${versions}" | jq -s 'add' | jq -r --argjson live "${live}" '
              map(select((.metadata.container.tags | map(select(. as $t | $live | index($t))) | length) == 0))
              | .[] | [.id, (.metadata.container.tags | join(","))] | @tsv')"
            [ -n "${deletions}" ] || echo "nothing to delete"
            while IFS=$'\t' read -r id tags; do
              [ -n "${id}" ] || continue
              delete_version "${pkg}" "${id}" "stale cache${tags:+, tags: ${tags}}"
            done <<<"${deletions}"
          fi
