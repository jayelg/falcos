---
# Follow-up work after a bot bumps an asset pin.
#
# Every `asset` block in a module.kdl carries a version, a download URL and
# a SHA256. Renovate can bump the version but cannot recompute the hash,
# and the resolved URL and hash are baked into Containerfile.generated,
# which lint checks for drift. Both of those are mechanical, so this
# workflow does them: on a PR touching a module manifest it recomputes each
# stale checksum, regenerates the Containerfile and pushes a single fixup
# commit to the PR branch. One workflow rather than one per asset so
# concurrent fixup pushes to the same branch cannot race each other.
#
# There is no table of assets here. `manifest.sh assets` reports every pin
# in the repository with its resolved URL, which is the same resolution the
# build uses, so the URL this hashes and the URL the build fetches cannot
# disagree. That was a real gap: the URL used to exist here and again in
# each module.sh, with nothing comparing them.
#
# The fixup push uses GITHUB_TOKEN, which never triggers the pull_request
# workflows on the new commit, so validation runs are dispatched explicitly
# (same pattern as kernel-freshness.yml).
name: Checksums

on:
  pull_request:
    paths:
      - 'modules/**/module.kdl'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  update-checksums:
    # Fork branches can't be pushed to; Renovate PRs are same-repo
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      # Full history: the job only checks the manifests this PR touched, so
      # it needs the base branch to diff against.
      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Recompute stale checksums and push fixup
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # Only the manifests this PR touched. Hashing every asset in the
          # repository on every manifest edit would download hundreds of
          # megabytes to confirm that nothing moved.
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          changed="$(git diff --name-only "$base" HEAD \
            | grep -E '^modules/.*/module\.kdl$' || true)"
          if [ -z "$changed" ]; then
            echo "No module manifest changed against ${BASE_REF}, nothing to do."
            exit 0
          fi
          echo "Changed manifests:"
          echo "$changed"

          fixed=()
          # module, name, manifest, version, sha256, hash source, URL
          while IFS=$'\t' read -r module name file version pinned from url; do
            grep -qxF "$file" <<< "$changed" || continue
            # A pin with no hash is a git ref the module clones, and a
            # manual one is a hash nothing derives: for an asset whose
            # filename does not follow from its version, recomputing would
            # hash whatever the old URL still serves.
            [ -n "$pinned" ] || continue
            if [ "$from" = "manual" ]; then
              echo "${module} ${name}: hash is maintained by hand, skipping."
              continue
            fi

            target="$url"
            [ "$from" != "sidecar" ] || target="${url}.sha256"
            if ! curl -fsSL --retry 3 "$target" -o "${RUNNER_TEMP}/asset"; then
              echo "::error file=${file}::${name} ${version}: ${target} did not download. A version bump whose asset filename does not follow from the version needs the url in ${file} updated by hand."
              exit 1
            fi
            if [ "$from" = "sidecar" ]; then
              actual="$(cut -d' ' -f1 < "${RUNNER_TEMP}/asset")"
            else
              actual="$(sha256sum "${RUNNER_TEMP}/asset" | cut -d' ' -f1)"
            fi
            rm -f "${RUNNER_TEMP}/asset"

            if [ "$actual" = "$pinned" ]; then
              echo "${module} ${name} ${version}: hash already matches."
              continue
            fi
            # Matched on the pinned value rather than by line, so the
            # from= property beside it survives. Both values are hex, so
            # there is nothing for sed to misread.
            sed -i "s/sha256 \"${pinned}\"/sha256 \"${actual}\"/" "$file"
            fixed+=("${name} ${version}")
            echo "${module} ${name} ${version}: hash updated."
          done < <(./scripts/manifest.sh assets)

          # The pins reach the build as env on each module's layer, so a
          # bumped version or a rewritten hash changes the generated
          # Containerfile too, and lint fails on the drift.
          ./scripts/gen-containerfile.sh

          if git diff --quiet; then
            echo "Nothing to fix up."
            exit 0
          fi

          if [ "${#fixed[@]}" -gt 0 ]; then
            message="update checksums: $(IFS=', '; echo "${fixed[*]}")"
          else
            message="regenerate the Containerfile for the bumped pins"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$message"
          git push origin "HEAD:${BRANCH}"

          # Re-validate the branch on the fixup commit. build.yml gates the
          # image build on its own lint job, so that one dispatch covers
          # both.
          gh workflow run build.yml --ref "$BRANCH"
